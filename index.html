/* ---------- Google-Tabelle per JSONP (gviz) ---------- */
function sheet(name, cb) {
  var fn = "cb" + Math.floor(Math.random() * 1e9), s = document.createElement("script"), done = false;
  var timer = setTimeout(function () { if (!done) { done = true; cb(null); } }, 20000);
  window[fn] = function (resp) {
    if (done) return; done = true; clearTimeout(timer);
    try { delete window[fn]; } catch (e) { window[fn] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
    if (!resp || resp.status === "error" || !resp.table) return cb(null);
    var cols = resp.table.cols, rows = [], i, j;
    for (i = 0; i < resp.table.rows.length; i++) {
      var r = resp.table.rows[i].c, o = {};

}
function kick(s) { return s ? '<div class="kicker">' + esc(s) + '</div>' : ""; }
function greeting() { var h = new Date().getHours(); return h < 11 ? "Guten Morgen." : (h < 18 ? "Guten Tag." : "Guten Abend."); }
function slug(name) {
  return String(name).split(" ")[0].toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z]/g, "");
}
function initials(name) { var w = String(name).split(" "), a = ""; for (var i = 0; i < w.length && a.length < 2; i++) if (w[i]) a += w[i].charAt(0); return a; }
var quoteTurn = 0;

function html(s) {
  var h = "", i, p;
  if (s.typ === "monatstipp") {
    var m = new Date().getMonth() + 1, t = null;
    for (i = 0; i < DATA.tipps.length; i++) if (DATA.tipps[i].monat === m) t = DATA.tipps[i];
    if (!t || !t.titel) return null;
    return '<div class="row"><div class="halo gold">' + esc(t.icon) + '</div><div class="grow">' +
           kick((s.kicker || "Tipp des Monats") + " · " + MONATE[m - 1]) + '<h1>' + hl(t.titel) + '</h1><p class="lead">' + esc(t.text) + '</p></div></div>';
  }
  if (s.typ === "willkommen") {
    return '<div class="row"><div class="grow">' + kick(s.kicker) + '<div class="hello">' + greeting() + '</div><h2>' + hl(s.titel) + '</h2>' +
           '<p class="lead">' + esc(s.text) + '</p></div><div class="card wxcard" data-wx="1"></div></div>';
  }
  if (s.typ === "liste") {
    p = points(s.punkte);
    h = kick(s.kicker) + '<h1>' + hl(s.titel) + '</h1>' + (s.text ? '<p class="lead">' + esc(s.text) + '</p>' : "") + '<div class="tiles">';
    for (i = 0; i < p.length && i < 6; i++)
      h += '<div class="card tile row"><div class="ic">' + esc(p[i].ic || "✓") + '</div><div><div class="t">' + esc(p[i].t) + '</div>' +
           (p[i].d ? '<div class="d">' + esc(p[i].d) + '</div>' : "") + '</div></div>';
    return '<div style="padding-top:20px">' + h + '</div></div>';
  }
  if (s.typ === "qr") {
    return '<div class="row"><div class="grow">' + (s.icon ? '<div class="bigic">' + esc(s.icon) + '</div>' : "") + kick(s.kicker) +
           '<h1>' + hl(s.titel) + '</h1><p class="lead">' + esc(s.text) + '</p></div>' +
           '<div class="qrcard">' + qrImg(s.url || "") + '<div class="cap">' + esc(s.cap) + '</div><div class="hint">Mit der Handykamera scannen</div></div></div>';
  }
  if (s.typ === "bewertungen") {
    p = points(s.punkte);
    h = '<div class="row"><div class="grow">' + kick(s.kicker) + '<div class="score">' + esc(s.titel) + '</div>' +
        '<div class="stars">★★★★★</div><div class="scoresub">aus ' + esc(s.text) + ' Google-Bewertungen</div>' +
        (s.url ? '<div class="row" style="margin-top:40px"><div class="minqr" style="margin:0 28px 0 0">' + qrImg(s.url) + '</div><div class="scoresub">' + esc(s.cap) + '</div></div>' : "") +
        '</div><div class="quotes">';
    for (i = 0; i < 2 && p.length; i++) {
      var q = p[(quoteTurn + i) % p.length];
      h += '<div class="card quote"><p>„' + esc(q.d) + '“</p><b>' + esc(q.t) + ' · Google-Bewertung</b></div>';
    }
    quoteTurn = (quoteTurn + 2) % Math.max(p.length, 1);
    return h + '</div></div>';
  }
  if (s.typ === "team" && teamPhoto) {
    p = points(s.punkte);
    h = '<div class="row"><div class="grow">' + kick(s.kicker) + '<h1>' + hl(s.titel) + '</h1><div class="names">';
    for (i = 0; i < p.length; i++) h += '<div>' + esc(p[i].t) + '<span>' + esc(p[i].d) + '</span></div>';
    return h + '</div></div><div class="teamphoto"><img src="img/team.jpg"></div></div>';
  }
  if (s.typ === "oeffnungszeiten") {
    p = points(s.punkte);
    var st = openState(s), today = TAGE[new Date().getDay()];
    h = '<div class="row"><div class="grow">' + kick(s.kicker) + '<h1>' + hl(s.titel) + '</h1><p class="lead">' + esc(s.text) + '</p>' +
        '<div class="status ' + (st.open ? 'open' : 'closed') + '">' + esc(st.label) + '</div></div><div class="card hours">';
    for (i = 0; i < p.length; i++)
      h += '<div class="row hrow' + (p[i].t === today ? ' today' : '') + '"><b>' + esc(p[i].t) + '</b><span>' + esc(p[i].d) + '</span></div>';
    return h + '</div></div>';
  }
  if (s.typ === "team") {
    p = points(s.punkte);
    h = '<div style="padding-top:30px">' + kick(s.kicker) + '<h1>' + hl(s.titel) + '</h1><div class="row team">';
    for (i = 0; i < p.length && i < 4; i++)
      h += '<div class="card member"><div class="photo">' + esc(initials(p[i].t)) +
           '</div><div class="n">' + esc(p[i].t) + '</div><div class="r">' + esc(p[i].d) + '</div></div>';
    return h + '</div></div>';
  }
  if (s.typ === "kontakt") {
    p = points(s.punkte);
    h = '<div style="padding-top:40px">' + kick(s.kicker) + '<h1>' + hl(s.titel) + '</h1><p class="lead">' + esc(s.text) + '</p><div class="row locs">';
    for (i = 0; i < p.length && i < 2; i++) {
      var parts = p[i].d.split("·");
      h += '<div class="card loc row"><div class="pin">📍</div><div><div class="n">' + esc(p[i].t) + '</div><div class="a">' + esc(trim(parts[0])) + '</div>' +
           (parts[1] ? '<div class="p">' + esc(trim(parts[1])) + '</div>' : "") + '</div></div>';
    }
    return h + '</div></div>';
  }
  return '<div class="row">' + (s.icon ? '<div class="halo">' + esc(s.icon) + '</div>' : "") + '<div class="grow">' + kick(s.kicker) +
         '<h1>' + hl(s.titel) + '</h1><p class="lead">' + esc(s.text) + '</p></div></div>';
}

/* Öffnungszeiten: "9:00–12:00 · 13:30–18:00" je Tag → Status jetzt */
function mins(t) { var m = String(t).match(/(\d{1,2})[:.](\d{2})/); return m ? +m[1] * 60 + +m[2] : null; }
function ranges(txt) {
  var out = [], parts = String(txt || "").split(/[·,]/);
  for (var i = 0; i < parts.length; i++) {
    var ab = parts[i].split(/[–-]/);
    if (ab.length === 2 && mins(ab[0]) !== null && mins(ab[1]) !== null) out.push([mins(ab[0]), mins(ab[1])]);
  }
  return out;
}
function fmt(m) { return Math.floor(m / 60) + ":" + pad(m % 60); }
function openState(s) {
  var p = points(s.punkte), n = new Date(), now = n.getHours() * 60 + n.getMinutes(), today = TAGE[n.getDay()], i, r, k;
  for (i = 0; i < p.length; i++) if (p[i].t === today) {
    r = ranges(p[i].d);
    for (k = 0; k < r.length; k++) {
      if (now >= r[k][0] && now < r[k][1]) return { open: true, label: "● Jetzt geöffnet bis " + fmt(r[k][1]) + " Uhr" };
      if (now < r[k][0]) return { open: false, label: "Heute wieder ab " + fmt(r[k][0]) + " Uhr geöffnet" };
    }
  }
  for (var d = 1; d <= 7; d++) {
    var tag = TAGE[(n.getDay() + d) % 7];
    for (i = 0; i < p.length; i++) if (p[i].t === tag && (r = ranges(p[i].d)).length)
      return { open: false, label: "Wieder geöffnet " + (d === 1 ? "morgen" : "am " + tag) + " ab " + fmt(r[0][0]) + " Uhr" };
  }
  return { open: false, label: "Derzeit geschlossen" };
}
function paintOpen() {
  var s = null, el = $("openpill");
  for (var i = 0; i < DATA.slides.length; i++) if (DATA.slides[i].typ === "oeffnungszeiten") { s = DATA.slides[i]; break; }
  if (!s) { el.style.display = "none"; return; }
  var st = openState(s);
  el.style.display = "block";
  el.className = "status " + (st.open ? "open" : "closed");
  el.innerHTML = st.open ? "● Geöffnet" : "Geschlossen";
}

/* Teamfotos: img/<vorname>.jpg, sonst bleiben die Initialen */
function photos(el, s) {
  if (s.typ !== "team") return;
  var p = points(s.punkte), boxes = el.getElementsByClassName("photo");
  for (var i = 0; i < boxes.length; i++) (function (box, name) {
    var img = new Image();
    img.onload = function () { box.innerHTML = ""; box.appendChild(img); };
    img.src = "img/" + slug(name) + ".jpg";
  })(boxes[i], p[i].t);
}

/* ---------- Ablauf ---------- */
var slides = [], idx = -1, dirty = true, cur = null;
function rebuild() { slides = []; for (var i = 0; i < DATA.slides.length; i++) slides.push(DATA.slides[i]); dirty = false; paintStatic(); }
function next() {
  if (dirty) { rebuild(); if (!FREEZE) idx = -1; }
  if (!slides.length) return;
  var tries = 0, h = null, s;
  do { idx = (idx + 1) % slides.length; s = slides[idx]; h = html(s); tries++; } while (!h && tries <= slides.length);
  if (!h) return;
  var el = document.createElement("div"); el.className = "slide"; el.innerHTML = h;
  $("slides").appendChild(el); photos(el, s); paintWeather();
  var old = cur; cur = el;
  setTimeout(function () { el.className = "slide on"; if (old) old.className = "slide"; }, 60);
  if (old) setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1200);
  var d = "";
  for (var i = 0; i < slides.length; i++) d += '<i' + (i === idx ? ' class="on"' : "") + '></i>';
  $("dots").innerHTML = d;
  clearTimeout(next.t);
  if (FREEZE) return;
  next.t = setTimeout(next, (parseFloat(cfg("Sekunden pro Folie", 15)) || 15) * 1000);
}

function paintStatic() {
  $("bsub").innerHTML = esc(cfg("Untertitel Kopfzeile", "Allianz Generalvertretung · Oelsnitz & Aue"));
  var b = null;
  for (var i = 0; i < DATA.slides.length; i++) if (DATA.slides[i].typ === "bewertungen") b = DATA.slides[i];
  $("badge").style.display = b ? "block" : "none";
  if (b) $("badge").innerHTML = "★ " + esc(b.titel) + " <span>· " + esc(b.text) + " Google-Bewertungen</span>";
  var t = $("ticker"), one = "";
  for (i = 0; i < DATA.ticker.length; i++) one += "<span>" + esc(DATA.ticker[i]) + "</span>";
  if (t.getAttribute("data-c") === one) return;
  t.setAttribute("data-c", one);
  t.innerHTML = one + one;                              // doppelt → nahtlose Endlosschleife
  t.style.paddingLeft = (b ? $("badge").offsetWidth + 40 : 110) + "px";
  var secs = Math.max(30, t.offsetWidth / 2 / 70);      // ca. 70 px pro Sekunde
  t.style.webkitAnimation = t.style.animation = "none";
  setTimeout(function () { t.style.webkitAnimation = t.style.animation = "tick " + secs + "s linear infinite"; }, 50);
}

/* ---------- Uhr & Wetter (Open-Meteo, ohne API-Key) ---------- */
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function clock() {
  var n = new Date();
  $("clock").innerHTML = pad(n.getHours()) + ":" + pad(n.getMinutes());
  $("date").innerHTML = TAGE[n.getDay()] + "<br>" + n.getDate() + ". " + MONATE[n.getMonth()];
  paintOpen();
}
var WX = { 0: "☀", 1: "🌤", 2: "⛅", 3: "☁", 45: "🌫", 48: "🌫", 51: "🌦", 53: "🌦", 55: "🌧", 56: "🌧", 57: "🌧", 61: "🌧", 63: "🌧", 65: "🌧",
           66: "🌧", 67: "🌧", 71: "🌨", 73: "🌨", 75: "❄", 77: "❄", 80: "🌦", 81: "🌧", 82: "⛈", 85: "🌨", 86: "🌨", 95: "⛈", 96: "⛈", 99: "⛈" };
var wx = null;
function paintWeather() {
  if (!wx) return;
  $("wxpill").style.display = "block";
  $("wxpill").innerHTML = wx.ic + "&nbsp; " + wx.t + "°";
  var cards = document.querySelectorAll("[data-wx]");
  for (var c = 0; c < cards.length; c++) {
    var h = '<div class="wxnow"><span>' + wx.ic + '</span>' + wx.t + '°</div><div class="wxplace">' + esc(cfg("Wetter-Ort", "")) +
            ' · heute ' + wx.days[0].min + '° bis ' + wx.days[0].max + '°</div><div class="row wxdays">';
    for (var i = 1; i < wx.days.length; i++)
      h += '<div class="wxday">' + wx.days[i].tag + '<b>' + wx.days[i].ic + '</b><i>' + wx.days[i].max + '°</i> / ' + wx.days[i].min + '°</div>';
    cards[c].innerHTML = h + '</div>';
  }
}
function weather() {
  var x = new XMLHttpRequest();
  x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + cfg("Breitengrad", "50.7236") + "&longitude=" + cfg("Längengrad", "12.7271") +
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin&forecast_days=4");
  x.onload = function () {
    try {
      var j = JSON.parse(x.responseText), d = j.daily, days = [];
      for (var i = 0; i < d.time.length; i++) {
        var p = d.time[i].split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
        days.push({ tag: KTAGE[dt.getDay()], ic: WX[d.weather_code[i]] || "", max: Math.round(d.temperature_2m_max[i]), min: Math.round(d.temperature_2m_min[i]) });
      }
      wx = { ic: WX[j.current.weather_code] || "", t: Math.round(j.current.temperature_2m), days: days };
      paintWeather();
    } catch (e) {}
  };
  x.send();
}

/* ---------- Bühne auf Bildschirm skalieren ---------- */
function fit() {
  var w = window.innerWidth, h = window.innerHeight, s = Math.min(w / 1920, h / 1080), a = $("app");
  var tf = "translate(" + Math.round((w - 1920 * s) / 2) + "px," + Math.round((h - 1080 * s) / 2) + "px) scale(" + s + ")";
  a.style.webkitTransform = a.style.transform = tf;
}

var teamPhoto = true;   /* img/team.jpg vorhanden → Gruppenfoto; fehlt es, Karten mit Initialen */
(function () { var im = new Image(); im.onerror = function () { teamPhoto = false; dirty = true; }; im.src = "img/team.jpg"; })();

/* ---------- Start ---------- */
/* Vorschau: index.html#3 zeigt fest Folie 3 */
var FREEZE = /^#\d+$/.test(location.hash);
if (FREEZE) idx = parseInt(location.hash.slice(1), 10) - 2;
fit(); window.onresize = fit;
var cached = load("wz2_data"); if (cached && cached.slides && cached.slides.length) DATA = cached;
clock(); setInterval(clock, 10000);
next();
weather(); setInterval(weather, 30 * 60 * 1000);
fetchAll(function (ok) { if (ok) { dirty = true; paintStatic(); weather(); } });
setInterval(function () { fetchAll(function (ok) { if (ok) dirty = true; }); }, 5 * 60 * 1000);
/* Um 3 Uhr nachts komplett neu laden – holt Updates der Seite selbst */
setInterval(function () { var n = new Date(); if (n.getHours() === 3 && n.getMinutes() < 6) location.reload(); }, 5 * 60 * 1000);
</script>
</body>
